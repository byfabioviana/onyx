# Build and push the jarvis-nginx image to Docker Hub
# Can be triggered manually for first-time setup
name: "[Setup] Build Jarvis Nginx Image"

on:
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.REGISTRY_USERNAME }}/jarvis-nginx

jobs:
  build:
    name: Build & Push Nginx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync nginx templates
        run: cp -a deployment/data/nginx/* docker/nginx/templates/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./docker/nginx
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## Nginx Image Built" >> $GITHUB_STEP_SUMMARY
          echo "Image: \`${{ env.IMAGE }}:latest\`" >> $GITHUB_STEP_SUMMARY
